<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ben Maxwell — UX Design Leader</title>
    <meta
      name="description"
      content="Portfolio of Ben Maxwell — a Design Leader who builds expert-level tools for fintech, insurance, travel, and mortgage. Ask the AI assistant anything about the work."
    />
    <!-- Open Graph defaults — per-page overrides handled by react-helmet-async -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ben Maxwell — viewbens.work" />
    <meta property="og:title" content="Ben Maxwell — UX Design Leader" />
    <meta
      property="og:description"
      content="Portfolio of Ben Maxwell — a Design Leader who builds expert-level tools for fintech, insurance, travel, and mortgage."
    />
    <meta property="og:url" content="https://viewbens.work" />
    <!-- OG images: create 1200×630 PNGs in /public/og/ before launch -->
    <meta property="og:image" content="https://viewbens.work/og/home.png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ben Maxwell — UX Design Leader" />
    <meta
      name="twitter:description"
      content="Portfolio of Ben Maxwell — a Design Leader who builds expert-level tools for fintech, insurance, travel, and mortgage."
    />
    <meta name="twitter:image" content="https://viewbens.work/og/home.png" />
    <!-- No static canonical tag here — every routed page sets its own via
         react-helmet-async (HomeV4Blend, AboutPage, ResumePage, CaseStudyPage).
         A static one here would duplicate/conflict with those. -->
    <!-- Google Fonts: preconnect + stylesheet link, discovered by the HTML preload
         scanner immediately rather than waiting on the CSS parse (was a blocking
         @import in index.css, which delayed font loading past first paint and
         caused layout shift on swap-in). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Theme is applied before first paint so a saved "futuristic" preference
         never flashes the retro dark theme. Retro is the default experience;
         the toggle lives in the NavBar (see src/hooks/useTheme.ts).

         CSP note: vercel.json's script-src allows this exact inline script
         via a sha256 hash (no 'unsafe-inline'). If you edit the text below,
         recompute the hash or the theme script will be silently blocked in
         production (causing a flash of the wrong theme) — see decisions.md
         2026-07-18 for the compute command. -->
    <script>
      try {
        var t = localStorage.getItem('viewbens-theme');
        if (t === 'futuristic') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
