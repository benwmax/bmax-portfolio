<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- BM_ favicon. SVG for modern browsers; 32px PNG for browsers without SVG favicon
         support; apple-touch-icon for iOS home screens. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page tags. scripts/prerender-meta.ts rewrites everything between these
         markers at build time, once per route, from src/seo/pageMeta.ts — so crawlers
         that don't run JavaScript (LinkedIn, Slack, iMessage, X) see the right title,
         description, and preview image for each page. The values here are the
         homepage's and only matter in `npm run dev`. Every tag carries data-page-meta
         so src/main.tsx can remove them on boot; PageHead then sets the live ones. -->
    <!-- page-meta:start -->
    <title data-page-meta>Ben Maxwell — UX Design Leader</title>
    <meta data-page-meta name="description" content="Portfolio of Ben Maxwell — a Design Leader who builds expert-level tools for fintech, insurance, travel, and mortgage. Ask the AI assistant anything about the work." />
    <link data-page-meta rel="canonical" href="https://viewbens.work" />
    <meta data-page-meta property="og:title" content="Ben Maxwell — UX Design Leader" />
    <meta data-page-meta property="og:description" content="Portfolio of Ben Maxwell — a Design Leader who builds expert-level tools for fintech, insurance, travel, and mortgage." />
    <meta data-page-meta property="og:url" content="https://viewbens.work" />
    <meta data-page-meta property="og:image" content="https://viewbens.work/og/home.png" />
    <meta data-page-meta name="twitter:title" content="Ben Maxwell — UX Design Leader" />
    <meta data-page-meta name="twitter:description" content="Portfolio of Ben Maxwell — a Design Leader who builds expert-level tools for fintech, insurance, travel, and mortgage." />
    <meta data-page-meta name="twitter:image" content="https://viewbens.work/og/home.png" />
    <!-- page-meta:end -->
    <!-- Site-wide tags, the same on every page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ben Maxwell — viewbens.work" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: preconnect + stylesheet link, discovered by the HTML preload
         scanner immediately rather than waiting on the CSS parse (was a blocking
         @import in index.css, which delayed font loading past first paint and
         caused layout shift on swap-in). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Theme is applied before first paint so a saved "futuristic" preference
         never flashes the retro dark theme. Retro is the default experience;
         the toggle lives in the NavBar (see src/hooks/useTheme.ts).

         CSP note: vercel.json's script-src allows this exact inline script
         via a sha256 hash (no 'unsafe-inline'). If you edit the text below,
         recompute the hash or the theme script will be silently blocked in
         production (causing a flash of the wrong theme) — see decisions.md
         2026-07-18 for the compute command. -->
    <script>
      try {
        var t = localStorage.getItem('viewbens-theme');
        if (t === 'futuristic') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
